<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Earth Codex</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/earthcodex-web.loader.js";
      
      // Explicit array of your 6 file chunks
      var dataChunks = [
        buildUrl + "/earthcodex-web.data00.part",
        buildUrl + "/earthcodex-web.data01.part",
        buildUrl + "/earthcodex-web.data02.part",
        buildUrl + "/earthcodex-web.data03.part",
        buildUrl + "/earthcodex-web.data04.part",
        buildUrl + "/earthcodex-web.data05.part"
      ];

      var config = {
        arguments: [],
        dataUrl: "", // This will be dynamically populated via Object URL below
        frameworkUrl: buildUrl + "/earthcodex-web.framework.js",
        codeUrl: buildUrl + "/earthcodex-web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "EduQlasse",
        productName: "Earth Codex",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      // 1. Fetch all data file chunks concurrently
      Promise.all(
        dataChunks.map(url => 
          fetch(url).then(response => {
            if (!response.ok) throw new Error("Failed to fetch chunk: " + url);
            return response.arrayBuffer();
          })
        )
      )
      .then(buffers => {
        // 2. Stitch the buffers into a singular data blob
        var combinedBlob = new Blob(buffers, { type: "application/octet-stream" });
        
        // 3. Bind the local object reference to your config object
        config.dataUrl = URL.createObjectURL(combinedBlob);

        // 4. Inject the standard Unity loader script now that data is ready
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      })
      .catch(err => {
        unityShowBanner("Critical error downloading build files: " + err.message, "error");
        console.error(err);
      });
    </script>
  </body>
</html>
